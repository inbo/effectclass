template:
  bootstrap: 5
  light-switch: false
url: https://inbo.github.io/effectclass/
navbar:
  title: ~
  type: default
  structure:
    left:  [intro, reference, tutorials, news, contributing]
    right: [search, github]
  components:
    news:
      text: Changelog
      href: news/index.html
    contributing:
      text: Contributing
      menu:
      - text: Contributing
        href: CONTRIBUTING.html
      - text: Code of conduct
        href: CODE_OF_CONDUCT.html
    tutorials:
      text: Tutorials
      href: articles/index.html
      menu:
      - text: Classification
        href: articles/classification.html
      - text: Visualising Effects with `ggplot2`
        href: articles/visualisation.html
      - text: Visualising Effects with `plotly`
        href: articles/interactive.html
reference:
- title: Classification of Effects
  contents:
  - has_concept("classification functions")
- title: ggplot2 add-ons
  contents:
  - has_concept("ggplot2 add-ons")
- title: plotly add-ons
  contents:
  - has_concept("plotly add-ons")
- title: Display
  contents:
  - has_concept("display functions")
- title: Utilities
  contents:
  - has_concept("utils")

authors:
